name: CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]

    steps:
      - uses: actions/checkout@v4

      - name: Build with warnings treated as errors
        run: make CC=${{ matrix.cc }} CFLAGS="-O2 -g -Werror"

      - name: Run unit tests
        run: make CC=${{ matrix.cc }} CFLAGS="-O2 -g -Werror" check

      - name: Validate the example configuration
        run: ./pipesix -t -c pipesix.conf.example

      - name: Shell syntax
        run: bash -n setup.sh netassist-up.sh build.sh

  sanitizers:
    name: address and UB sanitizers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make distclean
          make CC=clang CFLAGS="-O1 -g -Werror -fsanitize=address,undefined -fno-omit-frame-pointer" check

  package:
    name: build Linux and Windows artifacts
    runs-on: ubuntu-latest
    needs: [ build, sanitizers ]

    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 \
            gcc-aarch64-linux-gnu zip dpkg-dev

      - name: Build all targets
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ./build.sh --all --version "${GITHUB_REF_NAME#v}"
          else
            ./build.sh --all
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipesix-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipesix-dist
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/SHA256SUMS
